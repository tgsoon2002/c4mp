name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # ubuntu-latest has Google Chrome (/usr/bin/google-chrome, found by scripts/find-browser.js), so the real-browser tests run there;
      # on a runner without a Chrome-like browser they skip by themselves.
      - run: npm test -- --maxWorkers=2
