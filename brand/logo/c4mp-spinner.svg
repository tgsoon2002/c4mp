<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Loading">
  <!-- Logo 13 as the loading spinner: C, M and P circle the tent-4 like a crew around the fire, and the core glows.
       Light theme (#1F6F5C); for dark use #8FD9C2 and letters #F3F4F1. Pure SVG animation, no script. -->
  <style>
    @media (prefers-reduced-motion: reduce) { .crew, .glow { animation: none !important; } }
  </style>
  <g class="crew">
    <circle cx="70" cy="70" r="62" fill="none" stroke="#1F6F5C" stroke-width="2" stroke-dasharray="3 7"/>
    <g font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="30" fill="#1F6F5C" text-anchor="middle">
      <text x="24" y="80">C</text>
      <text x="112" y="44">M</text>
      <text x="112" y="122">P</text>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 70 70" to="360 70 70" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(44 34)" fill="none" stroke="#1F6F5C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M34 4 L4 40 H34 Z"/>
    <path d="M34 18 L16 40 H34" stroke-width="3.5"/>
    <path d="M34 4 V64 M34 40 H46"/>
  </g>
  <path class="glow" d="M78 64 L70 74 H78 Z" fill="#C9621F">
    <animate attributeName="opacity" values="1;0.45;1" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>
