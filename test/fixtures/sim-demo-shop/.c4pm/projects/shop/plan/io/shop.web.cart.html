<!-- Wireframe of screen shop.web.cart ('Cart'): the items on the left, the summary with Checkout on the right. -->
<link rel="stylesheet" href="site.css">
<div class="page">
  <div data-c4="header" class="row header">
    <div data-c4="logo" class="logo"></div>
    <div class="grow"></div>
    <input data-c4="search" class="search">
  </div>
  <div class="main">
    <div data-c4="items" class="col region wide">
      <div data-c4="item_list" class="items"></div>
      <div class="row">
        <div data-c4="qty" class="stepper"></div>
        <div class="grow"></div>
        <button data-c4="remove" class="btn"></button>
      </div>
    </div>
    <div data-c4="summary" class="col region side">
      <div data-c4="total" class="total"></div>
      <button data-c4="checkout_btn" class="btn-w"></button>
      <div data-c4="keep" class="link"></div>
    </div>
  </div>
  <div data-c4="footer" class="row footer">
    <div data-c4="footer_nav" class="links"></div>
  </div>
</div>
