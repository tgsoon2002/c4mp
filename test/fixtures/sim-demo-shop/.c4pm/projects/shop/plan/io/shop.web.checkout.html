<!-- Wireframe of screen shop.web.checkout ('Checkout'): the address form and the payment side by side. -->
<link rel="stylesheet" href="site.css">
<div class="page">
  <div data-c4="header" class="row header">
    <div data-c4="logo" class="logo"></div>
    <div class="grow"></div>
    <input data-c4="search" class="search">
  </div>
  <div class="main">
    <div data-c4="address" class="col region wide">
      <input data-c4="name" class="field">
      <input data-c4="street" class="field">
    </div>
    <div data-c4="pay" class="col region card">
      <input data-c4="card" class="field">
      <button data-c4="place" class="btn-w"></button>
    </div>
  </div>
  <div data-c4="footer" class="row footer">
    <div data-c4="footer_nav" class="links"></div>
  </div>
</div>
