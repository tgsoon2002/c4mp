<!-- Wireframe of screen shop.web.confirmation ('Order confirmation'): a centred summary with the order number. -->
<link rel="stylesheet" href="site.css">
<div class="page">
  <div data-c4="header" class="row header">
    <div data-c4="logo" class="logo"></div>
    <div class="grow"></div>
    <input data-c4="search" class="search">
  </div>
  <div class="center">
    <div data-c4="summary" class="col region card">
      <div data-c4="order_no" class="orderno"></div>
      <div data-c4="continue" class="link"></div>
    </div>
  </div>
  <div data-c4="footer" class="row footer">
    <div data-c4="footer_nav" class="links"></div>
  </div>
</div>
