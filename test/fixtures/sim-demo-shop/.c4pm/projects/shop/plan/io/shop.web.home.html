<!-- Wireframe of screen shop.web.home ('Home'): header, hero banner with the Shop now button, featured products, footer. -->
<link rel="stylesheet" href="site.css">
<div class="page">
  <div data-c4="header" class="row header">
    <div data-c4="logo" class="logo"></div>
    <div class="grow"></div>
    <input data-c4="search" class="search">
  </div>
  <div data-c4="hero" class="row hero">
    <button data-c4="shop_now" class="btn"></button>
  </div>
  <div data-c4="featured" class="row featured grow">
    <div data-c4="cards" class="cards"></div>
  </div>
  <div data-c4="footer" class="row footer">
    <div data-c4="footer_nav" class="links"></div>
  </div>
</div>
