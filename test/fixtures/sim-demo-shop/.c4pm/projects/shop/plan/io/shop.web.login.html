<!-- Wireframe of screen shop.web.login ('Login'): a centred sign-in card under a slim header. -->
<link rel="stylesheet" href="site.css">
<div class="page">
  <div data-c4="header" class="row header">
    <div data-c4="logo" class="logo"></div>
  </div>
  <div class="center">
    <div data-c4="form" class="col region card">
      <input data-c4="email" class="field">
      <input data-c4="password" class="field">
      <button data-c4="submit" class="btn-w"></button>
    </div>
  </div>
  <div data-c4="footer" class="row footer">
    <div data-c4="footer_nav" class="links"></div>
  </div>
</div>
