<!-- Wireframe of screen shop.web.product ('Product page'): the photo, the price and Add to cart, the reviews below. -->
<link rel="stylesheet" href="site.css">
<div class="page">
  <div data-c4="header" class="row header">
    <div data-c4="logo" class="logo"></div>
    <div class="grow"></div>
    <input data-c4="search" class="search">
  </div>
  <div class="col main">
    <div data-c4="info" class="row region grow">
      <div data-c4="photo" class="photo"></div>
      <div class="col grow buy">
        <div data-c4="price" class="price"></div>
        <button data-c4="add" class="btn"></button>
      </div>
    </div>
    <div data-c4="reviews" class="col region reviews">
      <div data-c4="review_list" class="revlist"></div>
    </div>
  </div>
  <div data-c4="footer" class="row footer">
    <div data-c4="footer_nav" class="links"></div>
  </div>
</div>
