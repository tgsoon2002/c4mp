<!-- Wireframe of screen shop.web.products ('Products'): filters on the left, the product grid with its pager on the right. -->
<link rel="stylesheet" href="site.css">
<div class="page">
  <div data-c4="header" class="row header">
    <div data-c4="logo" class="logo"></div>
    <div class="grow"></div>
    <input data-c4="search" class="search">
  </div>
  <div class="main">
    <div data-c4="filters" class="col region side">
      <div data-c4="category" class="list"></div>
      <div data-c4="price" class="slider"></div>
    </div>
    <div data-c4="results" class="col region wide">
      <div data-c4="grid" class="grid"></div>
      <div data-c4="pager" class="pager"></div>
    </div>
  </div>
  <div data-c4="footer" class="row footer">
    <div data-c4="footer_nav" class="links"></div>
  </div>
</div>
