  <script>/*C4PM_PRELUDE*/
  // P13-T11: collapse buttons for the side panels. Independent of tree.js/map.js; state is kept in
  // localStorage (c4mp.leftCollapsed / c4mp.rightCollapsed; the old c4pm.* keys are still read) and the page works with storage blocked.
  (function () {
    var main = document.getElementById('main');
    if (!main) return;
    // b269: raw string helpers; read/write below (booleans) and the width code use them. v === null removes the key.
    // Phase 35 C (b945): through C4PM_STORE (store.js): reads the new key, else the old one; writes the new key only.
    function rawGet(key) { return window.C4PM_STORE.get(key); }
    function rawSet(key, v) { if (v === null) window.C4PM_STORE.remove(key); else window.C4PM_STORE.set(key, v); }
    function read(key) { return rawGet(key) === '1'; }
    function write(key, on) { rawSet(key, on ? '1' : '0'); }
    function apply(side, collapsed) {
      main.classList.toggle(side + '-collapsed', collapsed);
      var btn = document.getElementById('toggle-' + side);
      if (!btn) return;
      btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      btn.title = (collapsed ? 'Show the ' : 'Hide the ') + side + ' panel';
      // arrow points toward the edge the panel collapses to (and away from it when collapsed)
      btn.innerHTML = (side === 'left') === collapsed ? '&#8250;' : '&#8249;';
    }
    var KEYS = { left: 'c4mp.leftCollapsed', right: 'c4mp.rightCollapsed' };
    // Cmd/Ctrl+click on a c-item or b-item opens the right panel through this (window.C4PM_SIDE.reveal(event)).
    window.C4PM_SIDE = {
      show: function (side) { apply(side, false); write(KEYS[side], false); },
      reveal: function (ev) { if (ev && (ev.metaKey || ev.ctrlKey)) this.show('right'); }
    };
    ['left', 'right'].forEach(function (side) {
      var key = KEYS[side];
      apply(side, read(key));
      var btn = document.getElementById('toggle-' + side);
      if (btn) btn.addEventListener('click', function () {
        var on = !main.classList.contains(side + '-collapsed');
        apply(side, on);
        write(key, on);
      });
    });
    // b269: drag a grip to resize a side panel. Width lives in --left-w / --right-w on #root (CSS default when unset),
    // is clamped, and is stored in c4mp.leftWidth / c4mp.rightWidth. Double-click a grip = back to the default.
    var root = document.getElementById('root');
    var CENTER_MIN = 320;
    var W = {
      left:  { min: 180, max: 480, v: '--left-w',  key: 'c4mp.leftWidth',  other: 'right' },
      right: { min: 280, max: 720, v: '--right-w', key: 'c4mp.rightWidth', other: 'left' }
    };
    function shown(side) {   // current laid-out width of a panel (0 when collapsed or unmeasurable)
      var el = document.getElementById(side === 'left' ? 'left' : 'panel-col');
      return main.classList.contains(side + '-collapsed') || !el ? 0 : (el.offsetWidth || 0);
    }
    function clampW(side, w) {
      var c = W[side], hi = c.max;
      if (main.clientWidth > 0) hi = Math.min(hi, main.clientWidth - shown(c.other) - CENTER_MIN);
      return Math.round(Math.max(c.min, Math.min(hi, w)));
    }
    function setW(side, w) { root.style.setProperty(W[side].v, clampW(side, w) + 'px'); return clampW(side, w); }
    function resetW(side) { root.style.removeProperty(W[side].v); rawSet(W[side].key, null); }
    if (root) ['left', 'right'].forEach(function (side) {
      var grip = document.getElementById('grip-' + side), c = W[side];
      var stored = rawGet(c.key), n = stored === null || stored === '' ? NaN : Number(stored);
      if (isFinite(n)) setW(side, n);
      if (!grip) return;
      function widthAt(x) {
        var r = main.getBoundingClientRect();
        return side === 'left' ? x - r.left : r.right - x;
      }
      grip.addEventListener('pointerdown', function (e) {
        if (e.button) return;
        try { grip.setPointerCapture(e.pointerId); } catch (err) {}
        grip.classList.add('dragging');
        if (e.preventDefault) e.preventDefault();
      });
      grip.addEventListener('pointermove', function (e) {
        if (grip.classList.contains('dragging')) setW(side, widthAt(e.clientX));
      });
      function end() {
        if (!grip.classList.contains('dragging')) return;
        grip.classList.remove('dragging');
        var cur = parseFloat(root.style.getPropertyValue(c.v));
        if (isFinite(cur)) rawSet(c.key, String(cur));
      }
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);
      grip.addEventListener('dblclick', function () { resetW(side); });
      grip.addEventListener('keydown', function (e) {   // arrows move the edge by 16px
        var d = e.key === 'ArrowRight' ? 16 : e.key === 'ArrowLeft' ? -16 : 0;
        if (!d) return;
        if (side === 'right') d = -d;
        var cur = shown(side) || parseFloat(root.style.getPropertyValue(c.v)) || 0;
        rawSet(c.key, String(setW(side, cur + d)));
        if (e.preventDefault) e.preventDefault();
      });
    });
  })();
  // P16-B20/B20b: "Top" edge tab (top centre of the map area) hides the whole top bar (display:none, nothing stays behind).
  // pressed = bar shown. State in localStorage c4mp.topHidden (old c4pm.topHidden still read); the page works with storage blocked.
  (function () {
    var root = document.getElementById('root');
    var btn = document.getElementById('btn-top');
    if (!root || !btn) return;
    function read() { return window.C4PM_STORE.get('c4mp.topHidden') === '1'; }
    function write(on) { window.C4PM_STORE.set('c4mp.topHidden', on ? '1' : '0'); }
    function apply(hidden) {
      root.classList.toggle('top-hidden', hidden);
      btn.setAttribute('aria-pressed', hidden ? 'false' : 'true');
      btn.textContent = hidden ? '▼' : '▲';   // arrow = what a click does: up hides the bar, down shows it
    }
    apply(read());
    btn.addEventListener('click', function () {
      var hidden = !root.classList.contains('top-hidden');
      apply(hidden);
      write(hidden);
    });
  })();
  /*C4PM_SCRIPTS*/</script>
